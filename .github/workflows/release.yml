# Tresor Release
# Triggered manually via workflow_dispatch with a version tag.
# Builds cross-platform binaries and publishes a GitHub Release.
#
# Targets:
#   Windows amd64 (.exe + .zip)
#   Linux   amd64, arm64 (.gz)
#   macOS   amd64, arm64 (.gz)
#   Android arm64, armv7 (.gz, for Termux — built via NDK with CGO)

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
      platforms:
        description: "Platforms to build"
        required: true
        type: choice
        default: windows,linux,macos
        options:
          - windows
          - linux
          - macos
          - android
          - windows,linux,macos
          - windows,linux,macos,android
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - Latest
          - Pre-release
        default: Latest

env:
  GO_VERSION: "1.26"

# ── Test (run before building) ──────────────────────────────────────
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: |
          go clean -testcache
          go test ./...

  # ── Build Windows (amd64) ─────────────────────────────────────────
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [test]
    if: contains(github.event.inputs.platforms, 'windows')
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compute version info
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "buildtime=$BUILDTIME" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          NAME="tresor-windows-${{ matrix.arch }}"
          go build -trimpath \
            -ldflags "-s -w -X 'tresor/cmd.Version=${{ steps.ver.outputs.version }}' -X 'tresor/cmd.BuildTime=${{ steps.ver.outputs.buildtime }}'" \
            -o "${NAME}.exe" .
          zip "${NAME}-${{ steps.ver.outputs.version }}.zip" "${NAME}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: tresor-windows-*
          retention-days: 7

  # ── Build Linux (amd64, arm64) ────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [test]
    if: contains(github.event.inputs.platforms, 'linux')
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compute version info
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "buildtime=$BUILDTIME" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          NAME="tresor-linux-${{ matrix.arch }}"
          go build -trimpath \
            -ldflags "-s -w -X 'tresor/cmd.Version=${{ steps.ver.outputs.version }}' -X 'tresor/cmd.BuildTime=${{ steps.ver.outputs.buildtime }}'" \
            -o "${NAME}" .
          gzip -c "${NAME}" > "${NAME}-${{ steps.ver.outputs.version }}.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: tresor-linux-*.gz
          retention-days: 7

  # ── Build macOS (amd64, arm64) ────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [test]
    if: contains(github.event.inputs.platforms, 'macos')
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compute version info
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "buildtime=$BUILDTIME" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          NAME="tresor-darwin-${{ matrix.arch }}"
          go build -trimpath \
            -ldflags "-s -w -X 'tresor/cmd.Version=${{ steps.ver.outputs.version }}' -X 'tresor/cmd.BuildTime=${{ steps.ver.outputs.buildtime }}'" \
            -o "${NAME}" .
          gzip -c "${NAME}" > "${NAME}-${{ steps.ver.outputs.version }}.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: tresor-darwin-*.gz
          retention-days: 7

  # ── Build Android (arm64, armv7) ──────────────────────────────────
  # Cross-compiled with the NDK for use inside Termux. Produces a bare
  # Android ELF binary (gzipped) rather than an APK.
  build-android:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [test]
    if: contains(github.event.inputs.platforms, 'android')
    strategy:
      matrix:
        arch:
          - { goarch: arm64, ndk: aarch64-linux-android21, output: arm64-v8 }
          - { goarch: arm,   ndk: armv7a-linux-androideabi21, output: armv7 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Compute version info
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILDTIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "buildtime=$BUILDTIME" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: android
          GOARCH: ${{ matrix.arch.goarch }}
          CGO_ENABLED: 1
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.arch.ndk }}-clang
        run: |
          NAME="tresor-android-${{ matrix.arch.output }}"
          go build -trimpath \
            -ldflags "-s -w -X 'tresor/cmd.Version=${{ steps.ver.outputs.version }}' -X 'tresor/cmd.BuildTime=${{ steps.ver.outputs.buildtime }}'" \
            -o "${NAME}" .
          gzip -c "${NAME}" > "${NAME}-${{ steps.ver.outputs.version }}.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch.output }}
          path: tresor-android-*.gz
          retention-days: 7

  # ── Publish GitHub Release ────────────────────────────────────────
  release:
    permissions:
      contents: write
    needs: [build-windows, build-linux, build-macos, build-android, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find previous tag
        id: prev
        run: |
          # Find the previous tag *before* creating the new one.
          # Exclude the current version tag in case it already exists locally.
          PREV=$(git tag --sort=-creatordate | grep -v "^${{ github.event.inputs.version }}$" | head -1)
          if [ -z "$PREV" ]; then
            echo "No previous tag found — listing all commits from repo start."
            echo "prev=ALL" >> $GITHUB_OUTPUT
          else
            echo "Previous tag: $PREV"
            echo "prev=$PREV" >> $GITHUB_OUTPUT
          fi

      - name: Create tag (local only)
        run: |
          git tag ${{ github.event.inputs.version }}

      - name: Generate release notes
        run: |
          if [ "${{ steps.prev.outputs.prev }}" = "ALL" ]; then
            bash .github/gen_release_note.sh -v "...${{ github.event.inputs.version }}"
          else
            bash .github/gen_release_note.sh \
              -v "${{ steps.prev.outputs.prev }}...${{ github.event.inputs.version }}"
          fi
          cat release.md

      - name: Push tag
        run: |
          git push origin ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Checksums
        working-directory: dist
        run: |
          find . -type f | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.release_type == 'Pre-release' }}
          files: |
            dist/*
          body_path: release.md
